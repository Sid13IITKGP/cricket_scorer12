name: Build iOS IPA

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install Ruby gems and CocoaPods
        run: |
          sudo gem install cocoapods || true
          brew install cocoapods || true

      - name: Get packages and install iOS pods
        run: |
          flutter pub get
          cd ios
          pod install --no-repo-update || true
          cd ..

      - name: Build IPA (no codesign)
        run: |
          # Build an unsigned IPA. For App Store distribution you need to supply
          # code signing credentials and configure export options.
          flutter build ipa --no-codesign || flutter build ios --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
